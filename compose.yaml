# Local development services. Ports bind to 127.0.0.1 only.
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-permitgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-permitgraph}
      POSTGRES_DB: ${POSTGRES_DB:-permitgraph}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
